plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Common compiles against plain vanilla Minecraft (NeoForm), so it cannot touch any loader API.
neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use in common.
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

// Resources written by the NeoForge data generators (./gradlew :neoforge:runData) are shared by both loaders.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava file('src/main/java')
    commonResources file('src/main/resources')
    commonResources file('src/generated/resources')
}
